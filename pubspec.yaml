name: tma
description: >-
  Type-safe Dart/Flutter bindings for the Telegram Mini Apps (Web Apps) API.
  Detects whether the app runs inside Telegram and degrades gracefully elsewhere.
version: 1.0.0
repository: https://github.com/crazyysasha/tma

environment:
  sdk: ^3.7.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
